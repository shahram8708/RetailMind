{% extends 'base.html' %}

{% block title %}500{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container text-center py-5">
        <h1 class="error-code">500</h1>
        <h2>Something Went Wrong</h2>
        <p class="text-muted">We're experiencing a technical issue. Our team has been notified.</p>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-primary" type="button" onclick="history.back()">Try Again</button>
            <a class="btn btn-outline-primary" href="mailto:support@retailmind.ai">Contact Support</a>
        </div>
    </div>
</section>
{% endblock %}
