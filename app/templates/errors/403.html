{% extends 'base.html' %}

{% block title %}403{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container text-center py-5">
        <h1 class="error-code">403</h1>
        <h2>Access Denied</h2>
        <p class="text-muted">You don't have permission to access this page.</p>
        <div class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-primary" type="button" onclick="history.back()">Go Back</button>
            {% if current_user.is_authenticated %}
                <a class="btn btn-outline-primary" href="{{ current_user.get_dashboard_route() }}">Go to Dashboard</a>
            {% else %}
                <a class="btn btn-outline-primary" href="{{ url_for('auth.login') }}">Go to Login</a>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}
