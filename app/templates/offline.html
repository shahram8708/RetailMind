<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RetailMind Offline</title>
    <style>
        :root {
            --navy: #0A1628;
            --blue: #1A6FE8;
            --light: #F8FAFC;
            --text: #111827;
            --muted: #6B7280;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--navy);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .offline-card {
            max-width: 640px;
            width: 100%;
            background: #fff;
            color: var(--text);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        }
        .brand {
            font-weight: 700;
            font-size: 22px;
            color: var(--navy);
        }
        .headline {
            font-size: 26px;
            margin-top: 12px;
        }
        .subtext {
            color: var(--muted);
            margin: 12px 0 20px;
        }
        .actions {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 14px;
            border-radius: 10px;
            text-decoration: none;
            border: 1px solid #E5E7EB;
            color: var(--text);
            font-weight: 600;
            background: var(--light);
            cursor: pointer;
        }
        .btn.primary {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }
        .offline-illustration {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #E2E8F0, #CBD5F5);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
        }
        .offline-illustration svg {
            width: 120px;
            height: 120px;
        }
        .available-list {
            margin: 16px 0 12px;
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="brand">RetailMind</div>
        <div class="offline-illustration">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="48" stroke="#1A6FE8" stroke-width="6"/>
                <path d="M35 60h50" stroke="#1A6FE8" stroke-width="6" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="headline">You are offline</div>
        <div class="subtext">RetailMind is working from cached data. You can still open key areas and your changes will sync when you reconnect.</div>
        <div class="available-list">Available offline</div>
        <div class="actions">
            <a class="btn" href="/dashboard">Dashboard</a>
            <a class="btn" href="/inventory">Inventory</a>
            <a class="btn" href="/campaigns">Campaigns</a>
            <a class="btn" href="/notifications">Notifications</a>
            <button class="btn primary" id="retryBtn" type="button">Retry connection</button>
        </div>
    </div>

    <script nonce="{{ csp_nonce }}">
        (function () {
            const params = new URLSearchParams(window.location.search);
            const redirectUrl = params.get('from') || document.referrer || '/dashboard';

            function retry() {
                window.location.href = redirectUrl;
            }

            window.addEventListener('online', retry);
            const btn = document.getElementById('retryBtn');
            if (btn) {
                btn.addEventListener('click', retry);
            }
        })();
    </script>
</body>
</html>
